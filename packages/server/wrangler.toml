name = "don-oogiri-server"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[routes]]
pattern = "don-api.jonnity.com"
custom_domain = true

[dev]
port = 8787
# WSL2からWindowsホスト経由でアクセスする場合など、localhost以外からの接続も受けられるようにする
ip = "0.0.0.0"
